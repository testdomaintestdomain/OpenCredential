name: Build OpenCredential & ALL Plugins

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-all:
    runs-on: windows-2022

    steps:
    # 1. Клонируем репозиторий
    - name: Checkout repository & submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    # 2. Инициализируем подмодули git
    - name: Init Git Submodules
      run: |
        git submodule update --init --recursive

    # 3. Подготавливаем MSBuild и NuGet
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    # 4. Скачиваем log4net и помещаем log4net.dll в необходимые директории external/lib
    - name: Download and prepare log4net.dll
      shell: powershell
      run: |
        Write-Host "Installing log4net via NuGet..."
        nuget install log4net -Version 2.0.15 -OutputDirectory ".\packages"
        
        $log4netDll = Get-ChildItem -Path ".\packages" -Filter "log4net.dll" -Recurse | Where-Object { $_.FullName -like "*net40*" -or $_.FullName -like "*net45*" -or $_.FullName -like "*net20*" } | Select-Object -First 1 -ExpandProperty FullName
        if (-not $log4netDll) {
            $log4netDll = Get-ChildItem -Path ".\packages" -Filter "log4net.dll" -Recurse | Select-Object -First 1 -ExpandProperty FullName
        }
        Write-Host "Found log4net.dll at: $log4netDll"

        $targetPaths = @(
            "OpenCredential\src\external\lib",
            "src\external\lib",
            "external\lib"
        )

        foreach ($relPath in $targetPaths) {
            $fullDir = Join-Path (Get-Location) $relPath
            if (-not (Test-Path $fullDir)) {
                New-Item -ItemType Directory -Force -Path $fullDir | Out-Null
            }
            Copy-Item $log4netDll -Destination (Join-Path $fullDir "log4net.dll") -Force
            Write-Host "Copied log4net.dll to: $fullDir"
        }

    # 5. Обновляем целевую версию .NET с v4.0 до v4.8 во всех C# проектах
    - name: Retarget .NET Framework to v4.8 in all C# projects
      shell: powershell
      run: |
        Get-ChildItem -Path . -Filter "*.csproj" -Recurse | ForEach-Object {
            Write-Host "Retargeting .NET Framework to v4.8 in: $($_.FullName)"
            $content = Get-Content $_.FullName
            $updated = $content -replace '<TargetFrameworkVersion>v4\.0</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>' `
                                -replace '<TargetFrameworkVersion>v4\.5.*?</TargetFrameworkVersion>', '<TargetFrameworkVersion>v4.8</TargetFrameworkVersion>'
            Set-Content -Path $_.FullName -Value $updated
        }

    # 6. Исправляем C++ Platform Toolset с v145 на v143 (для Visual Studio 2022)
    - name: Retarget C++ Projects (v145 -> v143)
      shell: powershell
      run: |
        Get-ChildItem -Path . -Filter "*.vcxproj" -Recurse | ForEach-Object {
            Write-Host "Retargeting C++ Toolset in: $($_.FullName)"
            (Get-Content $_.FullName) -replace '<PlatformToolset>v145</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' | Set-Content $_.FullName
        }

    # 7. Исправляем путь к MSBuild.exe в скрипте Build-OpenCredential.ps1
    - name: Patch Build-OpenCredential.ps1 MSBuild Path
      shell: powershell
      run: |
        $msbuild = (Get-Command msbuild.exe -ErrorAction SilentlyContinue).Source
        if (-not $msbuild) {
            $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        }
        Write-Host "Found MSBuild at: $msbuild"
        $scriptPath = ".\Build-OpenCredential.ps1"
        (Get-Content $scriptPath) -replace '\$msbuildPath = ".*"', "`$msbuildPath = '$msbuild'" | Set-Content $scriptPath

    # 8. Восстанавливаем пакеты NuGet для всех решений
    - name: Restore NuGet Packages for ALL solutions
      shell: powershell
      run: |
        Get-ChildItem -Path . -Filter "*.sln" -Recurse | ForEach-Object {
            Write-Host "Restoring NuGet packages for: $($_.FullName)"
            nuget restore $_.FullName
        }

    # 9. Сначала компилируем ядро OpenCredential
    - name: Build Core Solution
      shell: powershell
      run: |
        msbuild OpenCredential\src\OpenCredential-1.0.0.0.sln /p:Configuration=Release /p:Platform=x64 /m
        msbuild OpenCredential\src\OpenCredential-1.0.0.0.sln /p:Configuration=Release /p:Platform=Win32 /m

    # 10. Распространяем скомпилированные библиотеки SDK во ВСЕ папки плагинов
    - name: Sync SDK Assemblies across all plugin directories
      shell: powershell
      run: |
        $sourceBins = "OpenCredential\src\bin"
        $sdkDir = "Plugins\SDK"
        if (-not (Test-Path $sdkDir)) { New-Item -ItemType Directory -Force -Path $sdkDir | Out-Null }

        Get-ChildItem -Path $sourceBins -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $sdkDir -Force
        }

        Get-ChildItem -Path "Plugins" -Filter "*.csproj" -Recurse | ForEach-Object {
            $projDir = $_.DirectoryName
            Get-ChildItem -Path $sdkDir -Filter "*.dll" | ForEach-Object {
                Copy-Item $_.FullName -Destination $projDir -Force
            }
        }

    # 11. Прописываем АБСОЛЮТНЫЕ пути к SDK во ВСЕХ .csproj файлах
    - name: Fix HintPaths with Absolute SDK Path
      shell: powershell
      run: |
        $absSdkPath = Join-Path (Get-Location).Path "Plugins\SDK"
        Write-Host "Absolute SDK path: $absSdkPath"

        Get-ChildItem -Path "Plugins" -Filter "*.csproj" -Recurse | ForEach-Object {
            Write-Host "Updating HintPaths in: $($_.FullName)"
            $content = Get-Content $_.FullName
            $updated = $content -replace '<HintPath>.*?(OpenCredential|pGina)\.Abstractions\.dll</HintPath>', "<HintPath>$absSdkPath\OpenCredential.Abstractions.dll</HintPath>" `
                                -replace '<HintPath>.*?(OpenCredential|pGina)\.Shared\.dll</HintPath>', "<HintPath>$absSdkPath\OpenCredential.Shared.dll</HintPath>" `
                                -replace '<HintPath>.*?(OpenCredential|pGina)\.Core\.dll</HintPath>', "<HintPath>$absSdkPath\OpenCredential.Core.dll</HintPath>" `
                                -replace '<HintPath>.*?Abstractions\.dll</HintPath>', "<HintPath>$absSdkPath\OpenCredential.Abstractions.dll</HintPath>" `
                                -replace '<HintPath>.*?log4net\.dll</HintPath>', "<HintPath>$absSdkPath\log4net.dll</HintPath>"
            Set-Content -Path $_.FullName -Value $updated
        }

    # 12. Собираем все Core плагины и Contrib плагины (включая RADIUS)
    - name: Build Core and Contrib Plugins via Build-OpenCredential.ps1
      shell: powershell
      run: |
        .\Build-OpenCredential.ps1 -Target BuildAll -Configuration Release
        .\Build-OpenCredential.ps1 -Target BuildContribPlugins -Configuration Release

    # 13. Подготавливаем папку Contrib и раскомментируем её в инсталляторе
    - name: Prepare Contrib Plugins for Inno Setup
      shell: powershell
      run: |
        $contribBin = "Plugins\Contrib\bin"
        if (-not (Test-Path $contribBin)) {
            New-Item -ItemType Directory -Force -Path $contribBin | Out-Null
        }

        Get-ChildItem -Path "Plugins\Contrib" -Filter "*.dll" -Recurse | Where-Object { $_.FullName -notlike "*obj*" } | ForEach-Object {
            Copy-Item $_.FullName -Destination $contribBin -Force
            Write-Host "Prepared for Installer: $($_.Name)"
        }

        $issPath = "Installer\installer.iss"
        if (Test-Path $issPath) {
            $lines = Get-Content $issPath
            $newLines = @()
            foreach ($line in $lines) {
                if ($line -like "*Plugins\Contrib\bin\*") {
                    $newLines += $line.Replace(";", "")
                } else {
                    $newLines += $line
                }
            }
            Set-Content -Path $issPath -Value $newLines
            Write-Host "Uncommented Contrib line in $issPath"
        }

    # 14. Сборка инсталлятора Inno Setup
    - name: Compile Inno Setup Installer
      shell: cmd
      run: |
        iscc Installer\installer.iss

    # 15. Сбор всех скомпилированных DLL плагинов и архивация в ZIP
    - name: Collect ALL Plugin DLLs and Create ZIP
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "All_Compiled_Plugins"

        $searchDirs = @(
            "Plugins\Contrib\bin",
            "Plugins\Core\bin",
            "OpenCredential\src\bin",
            "Plugins\SDK"
        )

        foreach ($dir in $searchDirs) {
            if (Test-Path $dir) {
                Get-ChildItem -Path $dir -Filter "*.dll" | ForEach-Object {
                    Copy-Item $_.FullName -Destination "All_Compiled_Plugins\" -Force
                }
            }
        }

        Get-ChildItem -Path "Plugins" -Filter "OpenCredential.Plugin.*.dll" -Recurse | Where-Object { $_.FullName -notlike "*obj*" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "All_Compiled_Plugins\" -Force
        }

        Compress-Archive -Path "All_Compiled_Plugins\*" -DestinationPath "OpenCredential-All-Plugins.zip" -Force
        Write-Host "Created OpenCredential-All-Plugins.zip"

    # 16. Сохранение результатов в Артефакты
    - name: Upload Installer (.exe) Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenCredential-Complete-Setup
        path: |
          Installer/*.exe
          Installer/Output/*.exe

    - name: Upload ALL Plugins Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ALL-OpenCredential-Plugins-DLLs
        path: All_Compiled_Plugins/*.dll

    # 17. Публикация в GitHub Release
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || 'latest' }}
        name: OpenCredential Build Release (${{ github.ref_name }})
        body: |
          Automated release containing:
          - Complete OpenCredential Installer (.exe)
          - All compiled Core & Contrib plugins (including RADIUS) (.zip)
        draft: false
        prerelease: false
        files: |
          Installer/*.exe
          Installer/Output/*.exe
          OpenCredential-All-Plugins.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
