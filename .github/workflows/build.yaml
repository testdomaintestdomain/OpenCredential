name: Build OpenCredential & ALL Plugins

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: windows-2022

    steps:
    # 1. Клонируем репозиторий
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    # 2. Подготавливаем MSBuild и NuGet
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    # 3. Автоматически исправляем путь к MSBuild.exe в скрипте Build-OpenCredential.ps1
    - name: Patch Build-OpenCredential.ps1 with correct MSBuild Path
      shell: powershell
      run: |
        # Находим реальный путь к MSBuild.exe на сервере GitHub
        $msbuild = (Get-Command msbuild.exe -ErrorAction SilentlyContinue).Source
        if (-not $msbuild) {
            $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        }
        Write-Host "Found MSBuild at: $msbuild"

        # Заменяем жестко зашитый путь в Build-OpenCredential.ps1 на найденный
        $scriptPath = ".\Build-OpenCredential.ps1"
        (Get-Content $scriptPath) -replace '\$msbuildPath = ".*"', "`$msbuildPath = '$msbuild'" | Set-Content $scriptPath
        Write-Host "Successfully patched Build-OpenCredential.ps1"

    # 4. Восстанавливаем пакеты NuGet
    - name: Restore NuGet Packages for ALL solutions
      shell: powershell
      run: |
        Get-ChildItem -Path . -Filter "*.sln" -Recurse | ForEach-Object {
            Write-Host "Restoring NuGet packages for: $($_.FullName)"
            nuget restore $_.FullName
        }

    # 5. Сборка ядра OpenCredential и основных плагинов
    - name: Build Core Solution & Core Plugins
      shell: powershell
      run: |
        .\Build-OpenCredential.ps1 -Target BuildAll -Configuration Release

    # 6. Сборка всех дополнительных плагинов (включая RADIUS Plugin)
    - name: Build ALL Contrib Plugins
      shell: powershell
      run: |
        .\Build-OpenCredential.ps1 -Target BuildContribPlugins -Configuration Release

    # 7. Дополнительная принудительная сборка всех независимых плагинов
    - name: Build any orphan Plugin SLN files
      shell: powershell
      run: |
        Get-ChildItem -Path "Plugins" -Filter "*.sln" -Recurse | ForEach-Object {
            Write-Host "Building plugin solution: $($_.FullName)"
            msbuild $_.FullName /p:Configuration=Release /p:Platform="Any CPU" /m
        }

    # 8. Сборка единого инсталлятора Windows (.exe)
    - name: Compile Inno Setup Installer
      shell: cmd
      run: |
        iscc Installer\installer.iss

    # 9. Сбор всех скомпилированных DLL плагинов в одну папку
    - name: Collect ALL Plugin DLLs
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "All_Compiled_Plugins"
        Get-ChildItem -Path "Plugins" -Filter "*.dll" -Recurse | Where-Object { 
            $_.FullName -like "*Release*" -and $_.FullName -notlike "*obj*" 
        } | ForEach-Object {
            Write-Host "Collecting plugin: $($_.Name)"
            Copy-Item $_.FullName -Destination "All_Compiled_Plugins\" -Force
        }

    # 10. Загрузка инсталлятора в Артефакты
    - name: Upload Installer (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: OpenCredential-Complete-Setup
        path: |
          Installer/*.exe
          Installer/Output/*.exe

    # 11. Загрузка всех скомпилированных DLL плагинов
    - name: Upload ALL Plugins (.dll)
      uses: actions/upload-artifact@v4
      with:
        name: ALL-OpenCredential-Plugins-DLLs
        path: All_Compiled_Plugins/*.dll
